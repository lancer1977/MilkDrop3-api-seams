name: Windows API seam smoke

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/windows-api-seam-smoke.yml'
      - 'code/**'
      - 'tools/send-milkdrop-copydata.ps1'
      - 'docs/api-seams.md'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Prepare legacy DirectX SDK libraries (headers are now vendored)
        shell: pwsh
        run: |
          # D3DX9 headers (d3dx9.h, d3dx9math.h) are now vendored in code/vis_milk2/thirdparty/d3dx9/.
          # However, d3dx9.lib (import library) and d3d9.lib still need to be available for linking.
          # Try to locate these libraries on the runner.
          $dxDir = "C:\dx9"
          New-Item -ItemType Directory -Path "$dxDir\Lib\x86" -Force | Out-Null

          # Check if legacy DirectX SDK is already installed
          $legacyPath = "C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)"
          if (Test-Path "$legacyPath\Lib\x86\d3dx9.lib") {
            "DXSDK_DIR=$legacyPath" | Add-Content $env:GITHUB_ENV
            Write-Host "Using legacy DirectX SDK libraries at $legacyPath"
            exit 0
          }

          # Search for d3dx9.lib and d3d9.lib in standard locations
          $libSearchPaths = @(
            "C:\Program Files (x86)\Windows Kits\10\Lib\*\x86",
            "C:\Program Files\Microsoft Visual Studio\2022\*\VC\Tools\MSVC\*\lib\x86",
            "C:\Program Files (x86)\Microsoft Visual Studio\2019\*\VC\Tools\MSVC\*\lib\x86"
          )

          $foundD3dx9Lib = $false
          $foundD3d9Lib = $false

          foreach ($pattern in $libSearchPaths) {
            if (-not $foundD3dx9Lib) {
              $libs = @(Get-Item -Path "$pattern\d3dx9.lib" -ErrorAction SilentlyContinue)
              if ($libs.Count -gt 0) {
                Write-Host "Found d3dx9.lib: $($libs[0].FullName)"
                Copy-Item $libs[0].FullName "$dxDir\Lib\x86\" -ErrorAction SilentlyContinue
                $foundD3dx9Lib = $true
              }
            }

            if (-not $foundD3d9Lib) {
              $libs = @(Get-Item -Path "$pattern\d3d9.lib" -ErrorAction SilentlyContinue)
              if ($libs.Count -gt 0) {
                Write-Host "Found d3d9.lib: $($libs[0].FullName)"
                Copy-Item $libs[0].FullName "$dxDir\Lib\x86\" -ErrorAction SilentlyContinue
                $foundD3d9Lib = $true
              }
            }

            if ($foundD3dx9Lib -and $foundD3d9Lib) { break }
          }

          if ($foundD3dx9Lib -or $foundD3d9Lib) {
            "DXSDK_DIR=$dxDir" | Add-Content $env:GITHUB_ENV
            Write-Host "Configured DXSDK_DIR=$dxDir"
          } else {
            Write-Warning "Could not locate d3dx9.lib/d3d9.lib; build may fail but will continue"
          }

      - name: Check out source without Wine prefix
        shell: pwsh
        run: |
          # Do not use actions/checkout here: its initial Windows checkout
          # materializes the tracked POSIX device path .wine-test/dosdevices/c:.
          # Fetch without checkout, then archive/extract only the source needed
          # by this smoke.
          git init .
          git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          git config core.protectNTFS false
          git fetch --no-tags --depth=1 origin $env:GITHUB_SHA
          git archive --format=tar --output=source-subset.tar $env:GITHUB_SHA .github code docs/api-seams.md tools/send-milkdrop-copydata.ps1
          tar -xf source-subset.tar
          Remove-Item source-subset.tar

      - name: Build Debug Win32 target
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          $log = Join-Path $env:GITHUB_WORKSPACE 'api-seam-smoke-build.log'
          $msbuild = (Get-Command msbuild.exe -ErrorAction SilentlyContinue).Source
          if (-not $msbuild) {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
            if (Test-Path $vswhere) {
              $msbuild = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\Current\Bin\MSBuild.exe' | Select-Object -First 1
            }
          }
          if (-not $msbuild) {
            'MSBuild was not found on PATH or through vswhere.' | Set-Content $log
            $exitCode = 127
          } else {
            "Using MSBuild: $msbuild" | Set-Content $log
            & $msbuild code/MilkDrop3.sln /m /v:minimal /p:Configuration=Debug /p:Platform=Win32 *>> $log
            $exitCode = $LASTEXITCODE
          }
          "build_exit_code=$exitCode" | Add-Content $env:GITHUB_STEP_SUMMARY
          "exit_code=$exitCode" >> $env:GITHUB_OUTPUT
          Get-Content $log
          exit 0

      - name: Launch and exercise local WM_COPYDATA seam
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $evidencePath = Join-Path $env:GITHUB_WORKSPACE 'api-seam-smoke.jsonl'
          Remove-Item $evidencePath -ErrorAction SilentlyContinue

          function Write-Evidence([hashtable] $record) {
            $record.timestamp_utc = (Get-Date).ToUniversalTime().ToString('o')
            $record | ConvertTo-Json -Compress | Tee-Object -FilePath $evidencePath -Append
          }

          $builtExe = Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'code\vis_milk2\Debug') -Filter '*.exe' -File -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          $trackedExe = Join-Path $env:GITHUB_WORKSPACE 'code\vis_milk2\Debug\MilkDrop 3 new icon.exe'
          $buildExit = '${{ steps.build.outputs.exit_code }}'
          if ($buildExit -eq '0' -and $null -ne $builtExe) {
            $exe = $builtExe.FullName
            $source = 'current Debug build output'
          } elseif (Test-Path $trackedExe) {
            $exe = $trackedExe
            $source = 'tracked Debug fallback after build failure'
          } elseif ($null -ne $builtExe) {
            $exe = $builtExe.FullName
            $source = 'Debug output despite reported build failure'
          } else {
            Write-Evidence @{ phase='launch'; result='build_or_executable_failure'; build_exit_code=$buildExit }
            exit 0
          }

          Write-Evidence @{ phase='launch'; executable=$exe; executable_source=$source; build_exit_code=$buildExit }
          $process = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru -NoNewWindow:$false
          $deadline = (Get-Date).AddSeconds(30)
          $window = $null
          $checksPerformed = 0
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 500
            $process.Refresh()
            $checksPerformed++
            if ($process.HasExited) {
              Write-Evidence @{ phase='window'; result='process_exited_early'; pid=$process.Id; exit_code=$process.ExitCode; checks=$checksPerformed }
              break
            }
            if ($process.MainWindowHandle -ne 0 -and -not [string]::IsNullOrWhiteSpace($process.MainWindowTitle)) {
              $window = $process
              Write-Evidence @{ phase='window'; result='window_found_on_check'; pid=$process.Id; check_number=$checksPerformed; title=$process.MainWindowTitle }
              break
            }
          }

          if ($null -eq $window) {
            $exit = if ($process.HasExited) { $process.ExitCode } else { $null }
            Write-Evidence @{ phase='window'; result='window_not_observed'; pid=$process.Id; process_exited=$process.HasExited; process_exit_code=$exit }
          } else {
            Write-Evidence @{ phase='window'; result='window_observed'; pid=$window.Id; title=$window.MainWindowTitle; hwnd=('0x{0:X}' -f $window.MainWindowHandle.ToInt64()) }
          }

          $sender = Join-Path $env:GITHUB_WORKSPACE 'tools\send-milkdrop-copydata.ps1'
          $cases = @(
            @{ name='ping'; payload="command=ping"; expected='accepted' },
            @{ name='launch_sprite'; payload="command=launch_sprite`nsprite=01`nslot=-1"; expected='accepted' },
            @{ name='kill_sprite'; payload="command=kill_sprite`nslot=0"; expected='accepted' },
            @{ name='load_preset'; payload="command=load_preset`npath=C:\MilkDrop3\presets\Example.milk`nblend=1.7"; expected='accepted' },
            @{ name='random_preset'; payload="command=random_preset`nblend=1.7"; expected='accepted' },
            @{ name='malformed_out_of_range'; payload="command=launch_sprite`nsprite=9999`nslot=9999"; expected='rejected' }
          )

          foreach ($case in $cases) {
            $requestId = "gha-$($case.name)"
            $start = Get-Date
            $output = @(& powershell.exe -NoProfile -ExecutionPolicy Bypass -File $sender -WindowTitle 'MilkDrop' -Payload $case.payload -RequestId $requestId 2>&1 | ForEach-Object { $_.ToString() })
            $exitCode = $LASTEXITCODE
            $elapsedMs = [int]((Get-Date) - $start).TotalMilliseconds
            $observation = if ($null -eq $window) { 'no window observed; sender could not reach MilkDrop3' } else { 'sender attempted while window was observed' }
            $rejectionConfirmed = $false
            if ($case.name -eq 'malformed_out_of_range' -and $null -ne $window) {
              $rejectionConfirmed = (($output -join "`n") -match '(?im)^rejected') -and $exitCode -eq 2 -and $elapsedMs -lt 5000 -and -not $window.HasExited
            }
            Write-Evidence @{ phase='command'; name=$case.name; payload=$case.payload; expected=$case.expected; sender_output=($output -join "`n"); sender_exit_code=$exitCode; elapsed_ms=$elapsedMs; window_observation=$observation; malformed_rejection_confirmed=$rejectionConfirmed }
            if ($case.name -eq 'malformed_out_of_range' -and $null -ne $window -and -not $rejectionConfirmed) {
              Write-Evidence @{ phase='result'; result='malformed_payload_not_cleanly_rejected' }
              $malformedFailure = $true
            }
          }

          if ($null -ne $window) {
            $window.Refresh()
            Write-Evidence @{ phase='window'; result='post_commands'; pid=$window.Id; process_exited=$window.HasExited; title=$window.MainWindowTitle }
          }
          if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          if ($malformedFailure) { exit 1 }

      - name: Publish smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-api-seam-smoke-${{ github.run_id }}
          path: |
            api-seam-smoke.jsonl
            api-seam-smoke-build.log
          if-no-files-found: warn
